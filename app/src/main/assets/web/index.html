<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kwitansi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Kwitansi</h1>
        
        <div class="form-section">
            <div class="form-group">
                <label for="namaSiswa">Nama Siswa / Telah Diterima Dari <span class="required">*</span></label>
                <input type="text" id="namaSiswa" placeholder="Masukkan nama siswa" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="jurusan">Jurusan <span class="required">*</span></label>
                <select id="jurusan">
                    <option value="">-- Pilih Jurusan --</option>
                    <option value="IPS">IPS - Rp340.000,-</option>
                    <option value="IPA">IPA - Rp405.000,-</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Nomor Kwitansi</label>
                <input type="text" id="nomorKwitansi" value="INV-HH-2406-050" readonly>
                <small>Nomor kwitansi tetap sesuai template</small>
            </div>
            
            <div class="form-group">
                <label>Nominal Numerik (Pita Biru)</label>
                <input type="text" id="nominal" readonly>
            </div>
            
            <div class="form-group">
                <label>Keterangan Pembayaran (Untuk Pembayaran)</label>
                <textarea id="keterangan" readonly rows="5"></textarea>
            </div>
            
            <div class="button-group">
                <button type="button" id="btnBuat" class="btn btn-primary">Buat Kwitansi</button>
                <button type="button" id="btnSimpan" class="btn btn-success" disabled>Simpan JPG</button>
                <button type="button" id="btnBagikan" class="btn btn-info" disabled>Bagikan Kwitansi</button>
                <button type="button" id="btnReset" class="btn btn-secondary">Reset Form</button>
            </div>
        </div>
        
        <div class="preview-section">
            <h2>Pratinjau Kwitansi</h2>
            <div class="canvas-container">
                <canvas id="kwitansiCanvas"></canvas>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
